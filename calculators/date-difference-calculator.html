<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free date difference calculator - Calculate days, weeks, months, and years between two dates. Perfect for age calculation and planning.">
    <meta name="keywords" content="date difference calculator, days between dates, date calculator, time between dates, age in days">
    <title>Date Difference Calculator | CalcuPrime</title>
    <link rel="stylesheet" href="../css/style.css">
    
    <link rel="alternate" hreflang="en" href="https://calcuprime.com/calculators/date-difference-calculator.html">
    <link rel="alternate" hreflang="es" href="https://calcuprime.com/es/calculators/calculadora-diferencia-fechas.html">
    <link rel="alternate" hreflang="x-default" href="https://calcuprime.com/calculators/date-difference-calculator.html">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="canonical" href="https://calcuprime.com/calculators/date-difference-calculator.html">
</head>
<body>
    <header class="header">
        <nav class="nav container">
            <a href="../index.html" class="logo"><span class="logo-icon">⚡</span><span class="logo-text">CalcuPrime</span></a>
            <ul class="nav-menu"><li><a href="../index.html#everyday">Everyday</a></li></ul>
        </nav>
    </header>
    <main class="calculator-container">
        <div class="calculator-header">
            <h1 class="calculator-title">Date Difference Calculator</h1>
            <p class="calculator-description">Calculate the difference between two dates</p>
        </div>
        <div class="calculator-wrapper">
            <div class="calculator-inputs">
                <h3>Calculator</h3>
                <div class="form-group"><label for="startDate" class="form-label">Start Date</label><input type="date" id="startDate" class="form-input" value=""></div>
                <div class="form-group"><label for="endDate" class="form-label">End Date</label><input type="date" id="endDate" class="form-input" value=""></div>
                <button onclick="calculate()" class="btn-calculate">Calculate</button>
            </div>
            <div class="calculator-results">
                <h3>Results</h3>
                <div class="result-item"><div class="result-value" id="days" style="font-size: 2rem; color: #10b981;">-</div></div>
                <div class="result-item"><div class="result-value" id="weeks" style="font-size: 2rem; color: #10b981;">-</div></div>
                <div class="result-item"><div class="result-value" id="months" style="font-size: 2rem; color: #10b981;">-</div></div>
                <div class="result-item"><div class="result-value" id="years" style="font-size: 2rem; color: #10b981;">-</div></div>
            </div>
        </div>
    </main>
    <footer class="footer"><div class="container"><div class="footer-bottom"><p>&copy; 2024 CalcuPrime. All rights reserved.</p></div></div></footer>
    <script src="../js/main.js"></script>
    <script>
        function calculate() {
            
            const start = new Date(document.getElementById('startDate').value);
            const end = new Date(document.getElementById('endDate').value);
            const diff = Math.abs(end - start);
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const weeks = Math.floor(days / 7);
            const months = Math.floor(days / 30.44);
            const years = Math.floor(days / 365.25);
            document.getElementById('days').textContent = days.toLocaleString() + ' days';
            document.getElementById('weeks').textContent = weeks.toLocaleString() + ' weeks';
            document.getElementById('months').textContent = months + ' months';
            document.getElementById('years').textContent = years.toFixed(1) + ' years';
        
        }
        document.querySelectorAll('input, select').forEach(el => el.addEventListener('change', calculate));
        window.addEventListener('load', calculate);
    </script>
</body>
</html>
