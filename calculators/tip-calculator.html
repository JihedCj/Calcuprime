<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator | CalcuPrime</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/calculator.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <nav class="nav container">
            <a href="../index.html" class="logo"><span class="logo-icon">⚡</span><span class="logo-text">CalcuPrime</span></a>
            <ul class="nav-menu" id="navMenu">
                <li><a href="../index.html#finance">Finance</a></li>
                <li><a href="../index.html#health">Health</a></li>
            </ul>
        </nav>
    </header>
    <main class="calculator-container">
        <div class="calculator-header">
            <h1 class="calculator-title">Tip Calculator</h1>
            <p class="calculator-description">Calculate restaurant tips</p>
        </div>
        <div class="calculator-wrapper">
            <div class="calculator-inputs">
                <div class="form-group">
                    <label for="bill" class="form-label">Bill Amount ($)</label>
                    <input type="number" id="bill" class="form-input" value="50" min="0" step="0.01">
                </div>
                <div class="form-group">
                    <label for="tip" class="form-label">Tip (%)</label>
                    <input type="number" id="tip" class="form-input" value="15" min="0" max="100">
                </div>
                <div class="form-group">
                    <label for="people" class="form-label">Number of People</label>
                    <input type="number" id="people" class="form-input" value="1" min="1">
                </div>
                <button onclick="calc()" class="btn-calculate">Calculate</button>
            </div>
            <div class="calculator-results">
                <div class="result-item">
                    <div class="result-label">Tip Amount</div>
                    <div class="result-value" id="tipAmt">$0.00</div>
                </div>
                <div class="result-item">
                    <div class="result-label">Total per Person</div>
                    <div class="result-value" id="perPerson" style="font-size: 1.5rem;">$0.00</div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer"><div class="container"><div class="footer-bottom"><p>&copy; 2024 CalcuPrime. All rights reserved.</p></div></div></footer>
    <script src="../js/main.js"></script>
    <script>
        function calc(){const b=parseFloat(document.getElementById('bill').value)||0;const t=parseFloat(document.getElementById('tip').value)||0;const p=parseInt(document.getElementById('people').value)||1;const tip=b*t/100;const total=(b+tip)/p;document.getElementById('tipAmt').textContent='$'+tip.toFixed(2);document.getElementById('perPerson').textContent='$'+total.toFixed(2);}
        document.querySelectorAll('.form-input').forEach(i=>i.addEventListener('input',calc));
        window.addEventListener('load',calc);
    </script>
</body>
</html>
