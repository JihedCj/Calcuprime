<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Affordability Calculator | CalcuPrime</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/calculator.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <nav class="nav container">
            <a href="../index.html" class="logo"><span class="logo-icon">⚡</span><span class="logo-text">CalcuPrime</span></a>
            <ul class="nav-menu" id="navMenu">
                <li><a href="../index.html#finance">Finance</a></li>
            </ul>
        </nav>
    </header>
    <main class="calculator-container">
        <div class="calculator-header">
            <h1 class="calculator-title">Home Affordability Calculator</h1>
            <p class="calculator-description">How much house can you afford?</p>
        </div>
        <div class="calculator-wrapper">
            <div class="calculator-inputs">
                <div class="form-group">
                    <label for="income" class="form-label">Annual Income ($)</label>
                    <input type="number" id="income" class="form-input" value="75000" min="0">
                </div>
                <div class="form-group">
                    <label for="debt" class="form-label">Monthly Debt ($)</label>
                    <input type="number" id="debt" class="form-input" value="500" min="0">
                </div>
                <div class="form-group">
                    <label for="down" class="form-label">Down Payment ($)</label>
                    <input type="number" id="down" class="form-input" value="40000" min="0">
                </div>
                <div class="form-group">
                    <label for="rate" class="form-label">Interest Rate (%)</label>
                    <input type="number" id="rate" class="form-input" value="6.5" step="0.1">
                </div>
                <button onclick="calc()" class="btn-calculate">Calculate</button>
            </div>
            <div class="calculator-results">
                <div class="result-item">
                    <div class="result-label">Maximum Home Price</div>
                    <div class="result-value" id="maxPrice">$0</div>
                </div>
                <div class="result-item">
                    <div class="result-label">Monthly Payment</div>
                    <div class="result-value" id="monthly" style="font-size: 1.5rem;">$0</div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer"><div class="container"><div class="footer-bottom"><p>&copy; 2024 CalcuPrime. All rights reserved.</p></div></div></footer>
    <script src="../js/main.js"></script>
    <script>
        function calc(){const inc=parseFloat(document.getElementById('income').value)||0;const debt=parseFloat(document.getElementById('debt').value)||0;const down=parseFloat(document.getElementById('down').value)||0;const rate=parseFloat(document.getElementById('rate').value)/100/12||0;const maxMo=inc/12*0.28-debt;const n=360;const loan=maxMo*(Math.pow(1+rate,n)-1)/(rate*Math.pow(1+rate,n));const price=loan+down;document.getElementById('maxPrice').textContent='$'+price.toFixed(0);document.getElementById('monthly').textContent='$'+maxMo.toFixed(2);}
        document.querySelectorAll('.form-input').forEach(i=>i.addEventListener('input',calc));
        window.addEventListener('load',calc);
    </script>
</body>
</html>
