<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discount Calculator | CalcuPrime</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/calculator.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <nav class="nav container">
            <a href="../index.html" class="logo"><span class="logo-icon">⚡</span><span class="logo-text">CalcuPrime</span></a>
            <ul class="nav-menu" id="navMenu">
                <li><a href="../index.html#finance">Finance</a></li>
                <li><a href="../index.html#health">Health</a></li>
                <li><a href="../index.html#converters">Converters</a></li>
            </ul>
        </nav>
    </header>
    <main class="calculator-container">
        <div class="calculator-header">
            <h1 class="calculator-title">Discount Calculator</h1>
            <p class="calculator-description">Calculate sale prices and savings</p>
        </div>
        <div class="calculator-wrapper">
            <div class="calculator-inputs">
                <div class="form-group">
                    <label for="price" class="form-label">Original Price ($)</label>
                    <input type="number" id="price" class="form-input" value="100" min="0" step="0.01">
                </div>
                <div class="form-group">
                    <label for="discount" class="form-label">Discount (%)</label>
                    <input type="number" id="discount" class="form-input" value="20" min="0" max="100" step="0.1">
                </div>
                <button onclick="calc()" class="btn-calculate">Calculate</button>
            </div>
            <div class="calculator-results">
                <div class="result-item">
                    <div class="result-label">Final Price</div>
                    <div class="result-value" id="final">$0.00</div>
                </div>
                <div class="result-item">
                    <div class="result-label">You Save</div>
                    <div class="result-value" id="save" style="font-size: 1.5rem; color: #10b981;">$0.00</div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer"><div class="container"><div class="footer-bottom"><p>&copy; 2024 CalcuPrime. All rights reserved.</p></div></div></footer>
    <script src="../js/main.js"></script>
    <script>
        function calc(){const p=parseFloat(document.getElementById('price').value)||0;const d=parseFloat(document.getElementById('discount').value)||0;const s=p*d/100;const f=p-s;document.getElementById('final').textContent='$'+f.toFixed(2);document.getElementById('save').textContent='$'+s.toFixed(2);}
        document.querySelectorAll('.form-input').forEach(i=>i.addEventListener('input',calc));
        window.addEventListener('load',calc);
    </script>
</body>
</html>
