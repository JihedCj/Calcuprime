<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refinance Calculator | CalcuPrime</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/calculator.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <nav class="nav container">
            <a href="../index.html" class="logo"><span class="logo-icon">⚡</span><span class="logo-text">CalcuPrime</span></a>
            <ul class="nav-menu" id="navMenu">
                <li><a href="../index.html#finance">Finance</a></li>
            </ul>
        </nav>
    </header>
    <main class="calculator-container">
        <div class="calculator-header">
            <h1 class="calculator-title">Refinance Calculator</h1>
            <p class="calculator-description">Should you refinance your mortgage?</p>
        </div>
        <div class="calculator-wrapper">
            <div class="calculator-inputs">
                <div class="form-group">
                    <label for="balance" class="form-label">Current Balance ($)</label>
                    <input type="number" id="balance" class="form-input" value="" min="0">
                </div>
                <div class="form-group">
                    <label for="oldRate" class="form-label">Current Rate (%)</label>
                    <input type="number" id="oldRate" class="form-input" value="" step="0.1">
                </div>
                <div class="form-group">
                    <label for="newRate" class="form-label">New Rate (%)</label>
                    <input type="number" id="newRate" class="form-input" value="" step="0.1">
                </div>
                <div class="form-group">
                    <label for="years" class="form-label">Years Remaining</label>
                    <input type="number" id="years" class="form-input" value="" min="1">
                </div>
                <button onclick="calc()" class="btn-calculate">Calculate</button>
            </div>
            <div class="calculator-results">
                <div class="result-item">
                    <div class="result-label">Old Monthly Payment</div>
                    <div class="result-value" id="oldPmt" style="font-size: 1.5rem;">$0</div>
                </div>
                <div class="result-item">
                    <div class="result-label">New Monthly Payment</div>
                    <div class="result-value" id="newPmt" style="font-size: 1.5rem; color: #10b981;">$0</div>
                </div>
                <div class="result-item">
                    <div class="result-label">Monthly Savings</div>
                    <div class="result-value" id="save">$0</div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer"><div class="container"><div class="footer-bottom"><p>&copy; 2024 CalcuPrime. All rights reserved.</p></div></div></footer>
    <script src="../js/main.js"></script>
    <script>
        function calcPmt(p,r,n){const m=r/12;return p*(m*Math.pow(1+m,n))/(Math.pow(1+m,n)-1);}
        function calc(){const b=parseFloat(document.getElementById('balance').value)||0;const o=parseFloat(document.getElementById('oldRate').value)/100||0;const n=parseFloat(document.getElementById('newRate').value)/100||0;const y=parseInt(document.getElementById('years').value)||1;const m=y*12;const oldP=calcPmt(b,o,m);const newP=calcPmt(b,n,m);const save=oldP-newP;document.getElementById('oldPmt').textContent='$'+oldP.toFixed(2);document.getElementById('newPmt').textContent='$'+newP.toFixed(2);document.getElementById('save').textContent='$'+save.toFixed(2);}
        document.querySelectorAll('.form-input').forEach(i=>i.addEventListener('input',calc));
        window.addEventListener('load',calc);
    </script>
</body>
</html>
