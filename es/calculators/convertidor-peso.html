<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor de Weight - kg/lbs</title>
    <link rel="stylesheet" href="../../styles.css">
</head>
<body>
    <div class="calculator-container">
        <h1>Convertidor de Weight</h1>
        <p style="margin-bottom: 30px; color: #6b7280;">Convierte peso entre diferentes unidades.</p>
        <div class="input-group">
            <label class="form-label">Valor</label>
            <input type="number" id="input" class="form-input" value="">
        </div>
        <div class="input-group">
            <label class="form-label">Desde</label>
            <select id="from" class="form-input"></select>
        </div>
        <div class="result-card" id="results"></div>
    </div>
    <script src="../../converters.js"></script>
</body>
</html>
